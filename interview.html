<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3차 면접 기출질문 · 공인노무사</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="공인노무사 3차 면접 기출질문 모음. 법률지식·노동이슈·사례·윤리·신상 유형별 실제 면접 질문.">
<meta name="keywords" content="공인노무사 3차, 노무사 면접, 면접 기출질문, 면접 준비">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://cpla.wayexam.com/interview.html">
<meta property="og:title" content="3차 면접 기출질문 · 공인노무사">
<meta property="og:description" content="공인노무사 3차 면접 기출질문 유형별 정리">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cpla.wayexam.com/interview.html">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="images/icon-180.png">
<style>
.iv-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.iv-tab{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.iv-tab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.iv-year{margin:22px 0 8px;font-size:18px}
.iv-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:0 0 8px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.iv-item .q{flex:1;line-height:1.65;font-size:14.5px}
.iv-lock .q,.iv-lock .ans{filter:blur(5px);user-select:none;color:var(--muted)}
.iv-item .ans{margin-top:8px;padding:9px 12px;border-left:3px solid var(--primary);background:var(--panel-2);border-radius:6px;font-size:13.5px;line-height:1.7;color:var(--text)}
.iv-item .ans b{color:var(--primary);font-size:12px;display:block;margin-bottom:2px}
.iv-cta{background:rgba(15,23,42,.9);color:#fff;border-radius:12px;padding:14px 18px;margin:10px 0 18px;font-size:13.5px}
.iv-cta a{display:inline-block;margin-left:6px;background:#03C75A;color:#fff;padding:6px 12px;border-radius:8px;font-weight:700;text-decoration:none}
.iv-cta a.ghost{background:transparent;border:1px solid rgba(255,255,255,.5)}
</style>
</head>
<body>
<script src="js/common.js"></script>
<script>CPLA.renderHeader('interview');</script>
<main class="container">
 <div class="hero" style="padding:30px 32px">
  <h1 style="font-size:26px">3차 면접 기출질문</h1>
  <p>공인노무사 3차 면접에서 실제로 나온 질문을 연도·유형별로 정리하고, 질문마다 추천 답변 방향을 붙였습니다.</p>
  <div class="badges"><span id="iv-count">기출질문</span><span id="iv-free">최근 1개년 무료 공개</span></div>
 </div>
 <div class="iv-tabs" id="iv-tabs"></div>
 <div id="iv-list"></div>
</main>
<script>
(function(){
const STORE = 'https://smartstore.naver.com/sub-note/products/13500101192';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FILL = '노무사로서 해당 제도의 취지와 문제점에 대해 본인의 의견을 말씀해 보세요';
const FILL2 = '제도의 취지와 법적 근거를 먼저 설명하고 실무상 쟁점과 개선 방향을 균형 있게 제시한다. 노무사로서의 역할과 소신으로 마무리한다.';
let D = null, type = '전체';
function render(){
  document.querySelectorAll('.iv-tab').forEach(b=>b.classList.toggle('on', b.dataset.t===type));
  const its = D.items.filter(x=> type==='전체' || x.type===type);
  const byY = {}; its.forEach(x=>{ const k = x.yearLabel || String(x.year); (byY[k]=byY[k]||[]).push(x); });
  const keys = Object.keys(byY).sort((a,b)=> (parseInt(b)||0)-(parseInt(a)||0));
  let html = '';
  if (!D.full) html += `<div class="iv-cta">무료 이용 중: ${D.latestYear}년 질문은 전체 공개, 그 외 연도 질문과 추천 답변은 <b>Premium 회원</b> 전용입니다.
    ${D.user?'':'<a class="ghost" href="login.html">로그인</a>'}<a href="${STORE}" target="_blank" rel="noopener">Premium 회원권 보기</a></div>`;
  for (const k of keys){
    html += `<h3 class="iv-year">${esc(k)}${/^\d+$/.test(k)?'년':''} <span class="chip">${byY[k].length}문항</span></h3>`;
    html += byY[k].map(x=>`<div class="iv-item ${x.locked?'iv-lock':''}"><span class="chip purple">${esc(x.type)}</span><div class="q">${x.locked?FILL:esc(x.q)}${x.locked?'<div class="ans"><b>추천 답변 및 방향</b>'+FILL2+'</div>':(x.a?'<div class="ans"><b>추천 답변 및 방향</b>'+esc(x.a)+'</div>':'')}</div>${(!x.locked && x.src)?'<span class="chip">'+esc(x.src)+'</span>':''}</div>`).join('');
  }
  document.getElementById('iv-list').innerHTML = html || '<div class="empty">질문이 없습니다.</div>';
}
async function init(){
  try { D = await (await fetch('/api/exam3')).json(); } catch(e){ D = { items:[], full:false, latestYear:0 }; }
  document.getElementById('iv-count').textContent = `기출질문 ${D.items.length}개`;
  if (D.full) document.getElementById('iv-free').textContent = 'Premium 전체 공개';
  const types = ['전체', ...[...new Set(D.items.map(x=>x.type))]];
  document.getElementById('iv-tabs').innerHTML = types.map(t=>`<button class="iv-tab" data-t="${t}">${t}</button>`).join('');
  document.querySelectorAll('.iv-tab').forEach(b=>b.onclick=()=>{ type=b.dataset.t; render(); });
  render();
}
init();
})();
</script>
<script>CPLA.renderFooter();</script>
</body>
</html>
